<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome Kira 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(to bottom right, #ffe6f0, #fff0f5);
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 48px;
      color: #ff69b4;
      margin-bottom: 10px;
    }
    p {
      font-size: 18px;
      color: #555;
    }
    button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 18px;
      background-color: #ffb6c1;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #ff8da1;
    }
  </style>
</head>
<body>
  <h1>Welcome, Kira! 🌸</h1>
  <p>Your musical journey begins here.</p>
  <button onclick="location.href='playlist.html'">See My Playlist Made For You🎵</button>
</body>
</html>
