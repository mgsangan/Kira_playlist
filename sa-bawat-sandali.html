<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binibini 🎀</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at top left, #fff0f5, #ffe6f0);
      padding: 40px 15px;
      text-align: center;
      animation: fadeIn 1.5s ease-in;
      overflow-x: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background-color: #ffb6c1;
      padding: 16px;
      border-radius: 20px;
      max-width: 90%;
      margin: 0 auto 30px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 36px;
      color: white;
      margin: 0;
      text-shadow: 1px 1px #ff8da1;
    }

    #message {
      font-size: 18px;
      color: #555;
      max-width: 90%;
      margin: 0 auto 25px auto;
      line-height: 1.7;
      background-color: #fff0f5;
      padding: 16px;
      border-radius: 18px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      white-space: pre-wrap;
      text-align: left;
      visibility: hidden;
    }

    audio {
      margin-top: 20px;
      width: 100%;
      max-width: 320px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    a {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #ffb6c1;
      color: white;
      text-decoration: none;
      border-radius: 20px;
      font-size: 16px;
      transition: background-color 0.3s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    a:hover {
      background-color: #ff8da1;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎀 Binibini</h1>
  </div>

  <audio autoplay>
    <source src="song4.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div id="message"></div>

  <a href="playlist.html">← Back to Playlist</a>

  <script>
    const passage = `To Kira,

I may not be yours yet, but in every moment — sa bawat sandali — I’m choosing you.

I’m here, not to rush you, not to overwhelm you, but to show you, gently and truly, that my heart is steady. That in the quiet seconds, in the little gestures, in the way I listen and care — you’ll feel how much you mean to me.

Just like the song says, “Kapag magulo na ang mundo, ikaw ang payapang hinahanap-hanap ko.” Even now, when I’m still just someone hoping to be yours, you already bring peace to my world.

So I’ll keep showing up. In every moment. Until one day, if you’ll let me, I can be the one you hold onto too.

With quiet hope and all my heart, Mark

`;

    const messageDiv = document.getElementById("message");

    setTimeout(() => {
      messageDiv.style.visibility = "visible";
      let i = 0;
      const speed = 30;
      function typeWriter() {
        if (i < passage.length) {
          messageDiv.textContent += passage.charAt(i);
          i++;
          setTimeout(typeWriter, speed);
        }
      }
      typeWriter();
    }, 10000);
  </script>
</body>
</html>
