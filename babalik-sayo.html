<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Babalik Sayo 🍓</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at top left, #fffaf0, #ffe4e1);
      padding: 60px 20px;
      text-align: center;
      animation: fadeIn 1.5s ease-in;
      overflow-x: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background-color: #ff9eb5;
      padding: 20px;
      border-radius: 25px;
      max-width: 700px;
      margin: 0 auto 40px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 52px;
      color: white;
      margin: 0;
      text-shadow: 1px 1px #ff6f91;
    }

    #message {
      font-size: 20px;
      color: #555;
      max-width: 700px;
      margin: 0 auto 30px auto;
      line-height: 1.8;
      background-color: #fff0f5;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      white-space: pre-wrap;
      text-align: left;
      display: inline-block;
      visibility: hidden;
    }

    audio {
      margin-top: 30px;
      width: 320px;
      outline: none;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    a {
      display: inline-block;
      margin-top: 40px;
      padding: 12px 24px;
      background-color: #ff9eb5;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-size: 18px;
      transition: background-color 0.3s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    a:hover {
      background-color: #ff6f91;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🍓 Babalik Sayo</h1>
  </div>

  <audio autoplay>
    <source src="song2.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div id="message"></div>

  <a href="playlist.html">← Back to Playlist</a>

  <script>
    const passage = `To my Kira,

Every time I listen to Babalik Sayo, I feel the truth of what my heart’s been quietly saying: that no matter where life takes me, I’ll always find my way back to you.

You came into my life at the perfect moment — unexpected, yet everything I didn’t know I was praying for. Just like the song says, “Walang hihigit pa sa’yo, kahit pa ikutin ang mundo.” That’s how I feel about you. You’re the one my heart chooses, again and again.

I may not have all the answers, but I know this: I’m ready to do everything, to be everything, just to be with you. Because loving you feels like coming home. And if ever I drift, know that I’ll always — always — babalik sa’yo.

With all my heart,
Mark`;

    const messageDiv = document.getElementById("message");

    setTimeout(() => {
      messageDiv.style.visibility = "visible";
      let i = 0;
      const speed = 30;
      function typeWriter() {
        if (i < passage.length) {
          messageDiv.textContent += passage.charAt(i);
          i++;
          setTimeout(typeWriter, speed);
        }
      }
      typeWriter();
    }, 20000); // 20-second delay before typing starts
  </script>
</body>
</html>
