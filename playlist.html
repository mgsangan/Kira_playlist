  <title>Kira's Sweet Playlist</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(to bottom right, #fffaf0, #ffe4e1);
      padding: 60px 20px;
      animation: fadeIn 1.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background-color: #ffb6c1;
      padding: 20px;
      border-radius: 20px;
      max-width: 600px;
      margin: 0 auto 40px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      font-family: 'Pacifico', cursive;
      text-align: center;
      color: white;
      font-size: 44px;
      margin: 0;
      text-shadow: 1px 1px #ff8da1;
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 500px;
      margin: auto;
    }

    li a {
      display: block;
      background-color: #ffe6eb;
      margin: 14px 0;
      padding: 16px 20px;
      border-radius: 25px;
      font-size: 20px;
      color: #444;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    li a:hover {
      transform: scale(1.04);
      background-color: #ffd9e0;
    }
  </style>
</head>
